version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pokemon-backend:latest
    environment:
      - PORT=8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  loadgen:
    build:
      context: ./loadgen
      dockerfile: Dockerfile
    image: pokemon-loadgen:latest
    environment:
      - PORT=8082
      - BACKEND_URL=http://backend:8080
      - WORKERS=2
      - REQUEST_DELAY_MS=150
    ports:
      - "8082:8082"
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: pokemon-frontend:latest
    environment:
      - PORT=8081
      - BACKEND_URL=http://backend:8080
      - LOADGEN_URL=http://loadgen:8082
    ports:
      - "8081:8081"
    depends_on:
      - backend
      - loadgen
