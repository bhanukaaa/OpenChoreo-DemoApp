apiVersion: v1
kind: Namespace
metadata:
  name: pokemon-parca
---
# ==============================================================================
# Backend Service & Deployment
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: pokemon-backend
  namespace: pokemon-parca
  labels:
    app.kubernetes.io/name: pokemon-backend
    app.kubernetes.io/part-of: pokemon-parca
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: pokemon-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pokemon-backend
  namespace: pokemon-parca
  labels:
    app.kubernetes.io/name: pokemon-backend
    app.kubernetes.io/part-of: pokemon-parca
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pokemon-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pokemon-backend
      annotations:
        # Parca Agent Continuous Profiling Scrape Annotations
        parca.dev/scrape: "true"
        parca.dev/port: "8080"
        parca.dev/path: "/debug/pprof"
    spec:
      containers:
        - name: backend
          image: pokemon-backend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 256Mi
---
# ==============================================================================
# LoadGen Service & Deployment
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: pokemon-loadgen
  namespace: pokemon-parca
  labels:
    app.kubernetes.io/name: pokemon-loadgen
    app.kubernetes.io/part-of: pokemon-parca
spec:
  ports:
    - name: http
      port: 8082
      targetPort: 8082
  selector:
    app.kubernetes.io/name: pokemon-loadgen
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pokemon-loadgen
  namespace: pokemon-parca
  labels:
    app.kubernetes.io/name: pokemon-loadgen
    app.kubernetes.io/part-of: pokemon-parca
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pokemon-loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pokemon-loadgen
    spec:
      containers:
        - name: loadgen
          image: pokemon-loadgen:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8082"
            - name: BACKEND_URL
              value: "http://pokemon-backend.pokemon-parca.svc.cluster.local:8080"
            - name: WORKERS
              value: "2"
            - name: REQUEST_DELAY_MS
              value: "150"
          ports:
            - containerPort: 8082
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
---
# ==============================================================================
# Frontend Service & Deployment
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: pokemon-frontend
  namespace: pokemon-parca
  labels:
    app.kubernetes.io/name: pokemon-frontend
    app.kubernetes.io/part-of: pokemon-parca
spec:
  type: ClusterIP # Change to LoadBalancer or use Ingress for external access
  ports:
    - name: http
      port: 80
      targetPort: 8081
  selector:
    app.kubernetes.io/name: pokemon-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pokemon-frontend
  namespace: pokemon-parca
  labels:
    app.kubernetes.io/name: pokemon-frontend
    app.kubernetes.io/part-of: pokemon-parca
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pokemon-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pokemon-frontend
    spec:
      containers:
        - name: frontend
          image: pokemon-frontend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8081"
            - name: BACKEND_URL
              value: "http://pokemon-backend.pokemon-parca.svc.cluster.local:8080"
            - name: LOADGEN_URL
              value: "http://pokemon-loadgen.pokemon-parca.svc.cluster.local:8082"
          ports:
            - containerPort: 8081
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
